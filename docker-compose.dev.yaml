services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crispr
      POSTGRES_PASSWORD: crispr
      POSTGRES_DB: crispr_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crispr -d crispr_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
