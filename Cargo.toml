[package]
name = "crispr"
version = "0.1.0"
edition = "2021"
description = "Continuous Repair and Incident Self-Patching Runtime"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
governor = "0.6"

# gRPC for OTLP
tonic = "0.12"
prost = "0.13"

# OpenTelemetry proto definitions for OTLP ingest
opentelemetry-proto = { version = "0.28", features = ["gen-tonic", "logs"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }

# Object storage
object_store = { version = "0.9", features = ["aws", "azure", "gcp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# HTTP client (for LLM APIs, GitHub, Slack)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Compression
zstd = "0.13"

# Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# URL encoding
urlencoding = "2"

# Metrics
prometheus = "0.13"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
dotenvy = "0.15"
async-trait = "0.1"
futures = "0.3"
regex = "1"
mime_guess = "2"
hostname = "0.3"
glob = "0.3"

# Git operations for local repos
git2 = "0.18"

# Embed UI assets
rust-embed = "8"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# Testing utilities
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1.0", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
